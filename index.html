<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="images/favicon.png">
  <title>Sendr - Browsers into buyers</title>

  <!-- Tailwind via CDN: no build step needed to get started -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Fonts: a serif display paired with a clean sans for body/UI -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            paper: '#FAFAF8',
            ink: '#1C1C1A',
            stone: '#6B6B64',
            deepgreen: '#212721',
            accent: '#90BA92',
            mint: '#CADACF',
          },
          fontFamily: {
            display: ['"Fraunces"', 'serif'],
            sans: ['"Inter"', 'sans-serif'],
          },
        }
      }
    }
  </script>
</head>

<body class="bg-paper text-ink font-sans antialiased">

  <!-- ========== NAV ========== -->
  <header class="bg-deepgreen mx-auto px-6 md:px-10 py-8 flex items-center justify-between">
    <a href="#" class="ml-6 text-paper font-display text-3xl">Sendr</a>
    <nav class="mr-6 hidden md:flex gap-24 text-m text-mint">
      <a href="#" class="nav-link">Services</a>
      <a href="#work" class="nav-link">Work</a>
      <a href="#about" class="nav-link">About</a>
      <a href="#contact" class="nav-link">Contact</a>
    </nav>
    <details id="mobile-menu" class="mr-6 md:hidden text-mint">
      <summary class="relative z-50 cursor-pointer list-none" aria-label="Open navigation menu">
        <span class="block w-6 border-t-2 border-mint"></span>
        <span class="block w-6 border-t-2 border-mint mt-1.5"></span>
        <span class="block w-6 border-t-2 border-mint mt-1.5"></span>
      </summary>
      <div class="fixed inset-0 z-40 bg-ink/50" data-menu-backdrop></div>
      <nav class="fixed right-0 top-0 z-40 flex h-screen w-[min(85vw,24rem)] flex-col gap-12 bg-deepgreen px-8 pt-28 text-right text-lg shadow-2xl" aria-label="Mobile navigation">
        <a href="#" class="nav-link">Services</a>
        <a href="#work" class="nav-link">Work</a>
        <a href="#about" class="nav-link">About</a>
        <a href="#contact" class="nav-link">Contact</a>
      </nav>
    </details>
  </header>

  <!-- ========== HERO ========== -->
  <section class="mx-auto text-center px-6 md:px-10 pt-16 pb-24 md:pt-24 md:pb-32 bg-[url('/images/hero-bg.png')] bg-cover bg-center">
    <div class="max-w-5xl py-8 md:py-10 mt-10 mx-auto bg-paper bg-opacity-10 backdrop-blur-sm">
      <h1 class="font-display text-paper text-2xl sm:text-4xl md:text-6xl leading-[1.0] md:leading-[1.2] max-w-80 sm:max-w-lg md:max-w-2xl mx-auto">
        We create email strategies that convert
      </h1>
      <h1 class="font-display text-paper text-2xl sm:text-4xl md:text-6xl leading-[1.1] max-w-3xl mx-auto">
        <span id="typewriter" class="text-mint"></span><span class="inline-block w-[2px] h-[0.9em] bg-mint align-middle animate-pulse ml-0.5"></span>
      </h1>
      <p class="text-xs md:text-md mt-6 md:mt-12 text-mint">
        Founded and based in the United Kingdom.
      </p>
    </div>
    <div class="flex justify-center">
      <button class="flex items-center justify-between gap-12 md:gap-18 my-36 md:my-24 bg-deepgreen bg-opacity-50 md:hover:bg-opacity-70 text-paper w-auto py-4 px-6 md:px-8 text-left text-md md:text-2xl font-display button-underline">
        Book a call with us
        <svg xmlns="http://www.w3.org/2000/svg" width="48" height="16" viewBox="0 0 48 16" fill="none" aria-hidden="true" class="w-8 h-3 md:w-12 md:h-4">
          <path d="M1 8H43M43 8L36 1M43 8L36 15" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
    </div>
  </section>

  <!-- ========== CONTACT ========== -->
  <section id="contact" class="mx-auto px-6 md:px-10 py-24 border-t border-ink/10 hidden">
    <!-- ! Hidden -->
    <h2 class="font-display text-2xl mb-6">Get in touch</h2>
    <p class="text-stone max-w-md mb-8">
      Have a project in mind? Send a few details and I'll get back to you within a couple of days.
    </p>

    <!--
      Starter version: a mailto link, works immediately with zero setup.
      Swap the <a> below for a <form> pointed at a service like Formspree
      when you want a real in-page form instead of opening the user's email client.
    -->
    <a href="mailto:you@example.com"
       class="inline-block bg-accent text-paper px-6 py-3 text-sm hover:bg-ink transition-colors">
      you@example.com
    </a>
  </section>

  <!-- ========== FOOTER ========== -->
  <footer class="mx-auto px-6 md:px-10 py-8 text-sm bg-ink border-t-2 border-mint text-stone flex justify-between">
    <span>© 2026 Sendr</span>
    <div class="flex gap-6">
      <a href="#" class="nav-link">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor" class="fill-stone md:w-30 md:h-30" viewBox="0 0 16 16">
          <path d="M8 0C5.829 0 5.556.01 4.703.048 3.85.088 3.269.222 2.76.42a3.9 3.9 0 0 0-1.417.923A3.9 3.9 0 0 0 .42 2.76C.222 3.268.087 3.85.048 4.7.01 5.555 0 5.827 0 8.001c0 2.172.01 2.444.048 3.297.04.852.174 1.433.372 1.942.205.526.478.972.923 1.417.444.445.89.719 1.416.923.51.198 1.09.333 1.942.372C5.555 15.99 5.827 16 8 16s2.444-.01 3.298-.048c.851-.04 1.434-.174 1.943-.372a3.9 3.9 0 0 0 1.416-.923c.445-.445.718-.891.923-1.417.197-.509.332-1.09.372-1.942C15.99 10.445 16 10.173 16 8s-.01-2.445-.048-3.299c-.04-.851-.175-1.433-.372-1.941a3.9 3.9 0 0 0-.923-1.417A3.9 3.9 0 0 0 13.24.42c-.51-.198-1.092-.333-1.943-.372C10.443.01 10.172 0 7.998 0zm-.717 1.442h.718c2.136 0 2.389.007 3.232.046.78.035 1.204.166 1.486.275.373.145.64.319.92.599s.453.546.598.92c.11.281.24.705.275 1.485.039.843.047 1.096.047 3.231s-.008 2.389-.047 3.232c-.035.78-.166 1.203-.275 1.485a2.5 2.5 0 0 1-.599.919c-.28.28-.546.453-.92.598-.28.11-.704.24-1.485.276-.843.038-1.096.047-3.232.047s-2.39-.009-3.233-.047c-.78-.036-1.203-.166-1.485-.276a2.5 2.5 0 0 1-.92-.598 2.5 2.5 0 0 1-.6-.92c-.109-.281-.24-.705-.275-1.485-.038-.843-.046-1.096-.046-3.233s.008-2.388.046-3.231c.036-.78.166-1.204.276-1.486.145-.373.319-.64.599-.92s.546-.453.92-.598c.282-.11.705-.24 1.485-.276.738-.034 1.024-.044 2.515-.045zm4.988 1.328a.96.96 0 1 0 0 1.92.96.96 0 0 0 0-1.92m-4.27 1.122a4.109 4.109 0 1 0 0 8.217 4.109 4.109 0 0 0 0-8.217m0 1.441a2.667 2.667 0 1 1 0 5.334 2.667 2.667 0 0 1 0-5.334"/>
        </svg>
      </a>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
