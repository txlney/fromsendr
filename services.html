<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="images/favicon-v2.png">
  <title>FromSendr | Our Services</title>

  <!-- Fonts: a serif display paired with a clean sans for body/UI -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

  <!-- Built from tailwind.input.css + tailwind.config.js (see CLAUDE.md); must stay after styles.css -->
  <link rel="stylesheet" href="tailwind.css">
</head>

<body class="bg-paper text-ink font-sans antialiased">

  <!-- Header + hero together fill the first screen; the hero takes the remaining height -->
  <div class="min-h-svh flex flex-col">
  <!-- ========== NAV ========== -->
  <!-- Only the logo shows by default; hovering it (or tapping, on touch) drops the nav panel down. See .site-logo/.site-nav in styles.css -->
  <a href="index.html" class="site-logo" aria-label="FromSendr home">
    <img src="images/modern-logo-2.png" alt="" class="w-10 md:w-16">
  </a>
  <nav id="site-nav" class="site-nav flex flex-col items-end gap-10 md:flex-row md:flex-wrap md:justify-center md:gap-x-16 md:gap-y-4 lg:gap-x-32 text-mint text-sm font-bold uppercase" aria-label="Main navigation">
    <a href="services.html" class="nav-link-selected">Services</a>
    <a href="work.html" class="nav-link">Work</a>
    <a href="about.html" class="nav-link">About</a>
    <a href="contact.html" class="nav-link">Contact</a>
  </nav>

  <!-- ========== HERO ========== -->
  <section class="flex-1 flex flex-col justify-center relative w-full mx-auto text-center px-6 md:px-10 pt-16 pb-28 md:pt-24 md:pb-36 bg-stone">
    <div class="w-full max-w-5xl py-8 md:py-12 mx-auto bg-paper bg-opacity-10 backdrop-blur-md">
      <h1 class="font-display text-paper text-2xl sm:text-4xl md:text-6xl leading-[1.0] md:leading-[1.2] max-w-80 sm:max-w-lg md:max-w-2xl mx-auto">
        Services Page TBC
      </h1>
    </div>
    <div class="flex justify-center hidden">
      <a href="contact.html" class="btn btn-hero border-none w-full max-w-lg mt-24 md:mt-20 py-5 px-8 md:px-10">
        Book a call with us
        <svg xmlns="http://www.w3.org/2000/svg" width="48" height="16" viewBox="0 0 48 16" fill="none" aria-hidden="true" class="btn-arrow">
          <path d="M1 8H43M43 8L36 1M43 8L36 15" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </a>
    </div>
    <!-- Scroll cue: sits at the bottom of the first screen -->
    <div class="absolute bottom-6 md:bottom-10 left-1/2 -translate-x-1/2 flex flex-col items-center gap-3 text-mint" aria-hidden="true">
      <span class="text-xs uppercase tracking-[0.2em]">Scroll</span>
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="24" viewBox="0 0 16 24" fill="none" class="w-3 h-5 motion-safe:animate-bounce">
        <path d="M8 1V21M8 21L1 14M8 21L15 14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
  </section>
  </div>

  <!-- ========== FOOTER ========== -->
  <footer class="mx-auto px-6 md:px-10 py-8 text-sm bg-ink border-t-2 border-mint text-stone flex justify-between">
    <span>© 2026 FromSendr</span>
    <div class="flex gap-6">
      <a href="https://www.instagram.com/fromsendr/" target="_blank" rel="noopener noreferrer" class="nav-link" id="Instagram" aria-label="FromSendr on Instagram">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor" class="fill-stone" viewBox="0 0 16 16">

    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
